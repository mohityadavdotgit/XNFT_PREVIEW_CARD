<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFT Preview Card Component</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Google Fonts for Outfit -->
  <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

  <!-- Main Card Wrapper -->
  <main class="card">
    
    <!-- Image Wrapper with Hover Effect -->
    <div class="card__images">
      <img src="assets/images/image-equilibrium.jpg" alt="Equilibrium NFT" class="card__nft-img">
      <!-- Fixed W3C Standard XML Namespace for SVGs -->
      <div class="card__images-layer">
        <svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://w3.org">
          <g fill="none" fill-rule="evenodd">
            <path d="M0 0h48v48H0z"/>
            <path d="M24 9C14 9 5.46 15.22 2 24c3.46 8.78 12 15 22 15s18.54-6.22 22-15C42.54 15.22 34 9 24 9zm0 25c-5.52 0-10-4.48-10-10s4.48-10 10-10 10 4.48 10 10-4.48 10-10 10zm0-16c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6z" fill="#FFF" fill-rule="nonzero"/>
          </g>
        </svg>
      </div>
    </div>

    <!-- Title Wrapper Container (Fixed for Cypress Selector) -->
    <div class="card__title">
      <h1><a href="#">Equilibrium #3429</a></h1>
    </div>
    
    <!-- Description Container -->
    <p class="card__description">Our Equilibrium collection promotes balance and calm.</p>

    <!-- Pricing and Time Duration Block -->
    <div class="card__time">
      <!-- Ethereum Value Wrapper -->
      <div class="card__time-left">
        <svg width="11" height="18" viewBox="0 0 11 18" xmlns="http://w3.org">
          <path d="M11 10.216 5.5 18 0 10.216l5.5 3.263 5.5-3.263ZM5.5 0l5.496 9.169L5.5 12.43 0 9.17 5.5 0Z" fill="currentColor"/>
        </svg>
        <span>0.041 ETH</span>
      </div>
      
      <!-- Time Left Wrapper -->
      <div class="card__time-right">
        <svg width="17" height="17" viewBox="0 0 17 17" xmlns="http://w3.org">
          <path d="M8.305 0a8.305 8.305 0 1 0 0 16.61 8.305 8.305 0 0 0 0-16.61Zm0 14.948a6.643 6.643 0 1 1 0-13.286 6.643 6.643 0 0 1 0 13.286Zm.83-7.474h3.322v1.66H7.474V3.322h1.66v4.152Z" fill="currentColor"/>
        </svg>
        <span>3 days left</span>
      </div>
    </div>

    <hr class="card__divider">

    <!-- Creator Info Container -->
    <div class="card__creator">
      <img src="assets/images/image-avatar.png" alt="Avatar of Mohit Yadav" class="card__avatar">
      <p>Creation of <a href="#" class="card__creator-link">Mohit Yadav</a></p>
    </div>
  </main>

  <!-- Complete Attribution Footer Layout -->
  <footer class="attribution">
    Challenge by <a href="https://crio.do" target="_blank" rel="noopener noreferrer">Crio.do</a>. 
    Coded by <a href="https://github.com" target="_blank" rel="noopener noreferrer">Mohit Yadav</a>.
  </footer>

</body>
</html>
